# One assembling-machine-3 crafting automation-science-pack, needing TWO
# dedicated inputs (copper-plate from the west, iron-gear-wheel from the
# north) — two separate belt+inserter pairs feeding the same machine.
kind: function
name: science_assembler
params: {}
size: { width: 7, height: 6 }
entities:
  - name: transport-belt
    position: { x: 3, y: 0 }
    direction: south
  - name: inserter
    position: { x: 3, y: 1 }
    direction: north
  - name: transport-belt
    position: { x: 0, y: 3 }
    direction: south
  - name: inserter
    position: { x: 1, y: 3 }
    direction: west
  - name: assembling-machine-3
    position: { x: 2, y: 2 }
    direction: north
    recipe: automation-science-pack
  - name: inserter
    position: { x: 5, y: 3 }
    direction: west
  - name: transport-belt
    position: { x: 6, y: 3 }
    direction: south
  # Two poles, not one: this function is 7x6, and a single pole's
  # supply_radius (3.5) can't reach both the north inserter and the east
  # (output) inserter from any one corner — confirmed live as two of three
  # inserters reporting no_power while the third (closer to the one pole)
  # worked fine. (0,5) covers the west inserter; (5,0) covers north+east.
  # Neither is (0,0)/(0,1)/anywhere on local column x=0 at y<3 — those are
  # exactly where an in_copper connector's L-bend corner+leg lands whenever
  # the source chest shares this instance's y (every example here does),
  # confirmed live as a real placement collision twice now.
  - name: medium-electric-pole
    position: { x: 0, y: 5 }
  - name: medium-electric-pole
    position: { x: 5, y: 0 }
ports:
  in_copper:
    side: west
    offset: { x: 0, y: 3 }
    direction: south
    kind: belt
    item: copper-plate
  in_gear:
    side: north
    offset: { x: 3, y: 0 }
    direction: south
    kind: belt
    item: iron-gear-wheel
  out:
    side: south
    offset: { x: 6, y: 3 }
    direction: south
    kind: belt
    item: automation-science-pack
