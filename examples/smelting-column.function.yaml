# Phase 2 fixture. Note: this function has no inserters, so it doesn't
# actually smelt anything if you ran it for real — the belt lane just runs
# past the furnaces. It exists to exercise the format mechanism (params,
# repeat, ports, the connect.ts router), not as a working blueprint; a real
# smelting function would need inserters between the belt lane and each
# furnace, which is a natural follow-up once this is proven.
kind: function
name: smelting_column
params:
  furnace_count: { type: int, default: 6 }
  furnace_type: { type: string, default: "stone-furnace" }
  recipe: { type: string }
size: { width: 3, height: "${furnace_count * 2}" }
entities:
  - repeat: "${furnace_count}"
    name: "${furnace_type}"
    position: { x: 1, y: "${i * 2}" }
    direction: south
    recipe: "${recipe}"
  - repeat: "${furnace_count}"
    name: transport-belt
    position: { x: 0, y: "${i * 2}" }
    direction: south
ports:
  in:
    side: west
    offset: { x: 0, y: 0 }
    direction: south
    kind: belt
    item: iron-ore
  out:
    side: east
    offset: { x: 2, y: "${(furnace_count-1)*2}" }
    direction: south
    kind: belt
    item: iron-plate
