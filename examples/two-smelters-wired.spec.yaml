# Phase 2 hard-fail fixture: both smelt1.out and smelt2.in face south (same
# direction, not perpendicular) but are offset diagonally, so neither the
# straight case (needs axis alignment) nor the L-bend case (needs
# perpendicular directions) applies. `factoriollm validate` on this must fail
# with UNROUTABLE_CONNECTION and never touch RCON — see
# examples/two-belts-wired.spec.yaml for the successful, live-applied case.
kind: spec
server:
  rcon: { host: 127.0.0.1, port: 27015, password_env: FACTORIOLLM_RCON_PASSWORD }
  script_output_dir: /home/ideku/fb/instance/script-output
imports:
  - smelting-column.function.yaml
instances:
  - id: smelt1
    function: smelting_column
    position: { x: 10, y: 10 }
    params: { furnace_count: 6, recipe: iron-plate }
  - id: smelt2
    function: smelting_column
    position: { x: 20, y: 10 }
    params: { furnace_count: 6, recipe: copper-plate }
connections:
  - { from: smelt1.out, to: smelt2.in, kind: belt }
