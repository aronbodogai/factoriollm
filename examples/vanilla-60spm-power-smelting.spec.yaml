  # Relay spine: solar rows' own poles sit at absolute x=13.5 (local x=2/8/13
  # + row offset 0). Wire_reach is 9, so relays at x=20 (6.5 from the spine)
  # and spaced 8 apart vertically link the whole solar farm into one network
  # reaching east toward the smelting/assembly area.
  - id: relay1
    function: single_pole
    position: { x: 20, y: 1 }
  - id: relay2
    function: single_pole
    position: { x: 20, y: 9 }
  - id: relay3
    function: single_pole
    position: { x: 20, y: 17 }
  - id: relay4
    function: single_pole
    position: { x: 20, y: 25 }
  - id: relay5
    function: single_pole
    position: { x: 20, y: 33 }
  - id: relay6
    function: single_pole
    position: { x: 20, y: 41 }
  - id: relay7
    function: single_pole
    position: { x: 20, y: 49 }
  - id: relay8
    function: single_pole
    position: { x: 20, y: 57 }
  # Second relay column bridging the furnace zone's own poles (x=28) toward
  # the assembly zone further east (x=45-53), applied in the other half.
  - id: relay9
    function: single_pole
    position: { x: 37, y: 0 }
  - id: relay10
    function: single_pole
    position: { x: 37, y: 15 }
  - id: relay11
    function: single_pole
    position: { x: 37, y: 30 }
  # Third relay column: relay9/10/11 at x=37 are 13 tiles from the assembly
  # stage's own poles at x=50 (that stage's science_assembler pole sits at
  # local x=0 — miscalculated this as "close enough" the first time), which
  # exceeds wire_reach (9) — confirmed live as an isolated single-pole
  # network. x=43 sits within reach of both.
  - id: relay12
    function: single_pole
    position: { x: 43, y: 0 }
  - id: relay13
    function: single_pole
    position: { x: 43, y: 15 }
  - id: relay14
    function: single_pole
    position: { x: 43, y: 30 }
connections:
  - { from: iron_ore_1.out, to: iron_furnace_1.in, kind: belt }
  - { from: iron_ore_2.out, to: iron_furnace_2.in, kind: belt }
  - { from: iron_ore_3.out, to: iron_furnace_3.in, kind: belt }
  - { from: iron_ore_4.out, to: iron_furnace_4.in, kind: belt }
  - { from: copper_ore_1.out, to: copper_furnace_1.in, kind: belt }
  - { from: copper_ore_2.out, to: copper_furnace_2.in, kind: belt }
