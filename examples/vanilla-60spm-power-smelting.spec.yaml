# Part 1 of 2 (see vanilla-60spm-assembly.spec.yaml for the rest) — split
# because one spec covering the whole factory compiles to a plan JSON over
# the 50,000-char single-RCON-command safety limit (326 entities ~= 54,000
# chars; chunked delivery isn't implemented yet, see
# packages/cli/src/deploy/trigger.ts). Each half applies independently with
# its own state file.
#
# Fresh vanilla no-biters test map, building toward 60 automation-science-pack/min.
# Uses this server's daytime convention where 0 is full daylight
# (surf.daytime=0, surf.freeze_daytime=true — a test-setup step, not part of
# the format; 0.5, initially assumed to be "noon", turned out to be when
# panels report no_power) so solar output is constant and no accumulators
# are needed.
kind: spec
server:
  rcon: { host: 127.0.0.1, port: 27015, password_env: FACTORIOLLM_RCON_PASSWORD }
  script_output_dir: /home/ideku/fb/instance/script-output
imports:
  - solar-row.function.yaml
  - single-pole.function.yaml
  - furnace-row.function.yaml
instances:
  # One dedicated chest per furnace, not one shared belt feeding several —
  # verified live that a single inserter on a shared belt drains 100% of
  # supply before it can reach a second consumer (see drillPlacer.ts). Each
  # furnace_row here uses count:1, so this is really "4 separate iron
  # smelters" and "2 separate copper smelters", each self-contained.
  - id: iron_ore_1
    resource: iron-ore
    resource_mode: infinity_chest
    position: { x: 22, y: -3 }
  - id: iron_furnace_1
    function: furnace_row
    position: { x: 25, y: 0 }
    params: { count: 1 }
  - id: iron_ore_2
    resource: iron-ore
    resource_mode: infinity_chest
    position: { x: 22, y: 3 }
  - id: iron_furnace_2
    function: furnace_row
    position: { x: 25, y: 6 }
    params: { count: 1 }
  - id: iron_ore_3
    resource: iron-ore
    resource_mode: infinity_chest
    position: { x: 22, y: 9 }
  - id: iron_furnace_3
    function: furnace_row
    position: { x: 25, y: 12 }
    params: { count: 1 }
  - id: iron_ore_4
    resource: iron-ore
    resource_mode: infinity_chest
    position: { x: 22, y: 15 }
  - id: iron_furnace_4
